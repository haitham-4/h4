<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الألعاب - PS4 Host</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: #020b1e;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .banner-container {
            position: relative;
            width: 100%;
            max-width: 480px;
        }
        .banner-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }
        /* ضبط موقع النص في سنتر المستطيل المفرغ */
        .status-text {
            position: absolute;
            top: 44%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65%;
            text-align: center;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }
        .status-text.success {
            color: #00ff66;
            text-shadow: 0 0 10px #00ff66;
        }
        .status-text.failed {
            color: #ff3333;
            text-shadow: 0 0 10px #ff3333;
        }
    </style>
</head>
<body>

    <div class="banner-container">
        <img src="logo.png" alt="عالم الألعاب" class="banner-img">
        
        <div id="status-box" class="status-text">
            جاري التفعيل تلقائي...
        </div>
    </div>

    <script>
        function setStatus(type, text) {
            const box = document.getElementById('status-box');
            box.className = 'status-text ' + type;
            box.innerText = text;
        }
    </script>
</body>
</html>
