<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الألعاب - PS4 Host</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: #020b1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px 10px;
            text-align: center;
        }
        .logo-img {
            max-width: 90%;
            width: 350px;
            height: auto;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .badge {
            border: 1px solid #ffd700;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 13px;
            color: #ffd700;
            margin-bottom: 20px;
        }
        .status-box {
            width: 90%;
            max-width: 380px;
            padding: 18px;
            border: 2px solid #ffd700;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }
        .status-box.success {
            border-color: #00ff66;
            color: #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.5);
        }
        .status-box.failed {
            border-color: #ff3333;
            color: #ff3333;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.5);
        }
        .services {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 420px;
        }
        .service-btn {
            border: 1px solid #ffd700;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 12px;
            background: rgba(0,0,0,0.4);
            color: #fff;
        }
        .footer {
            width: 100%;
            max-width: 420px;
            border: 1px solid #1a365d;
            border-radius: 15px;
            padding: 12px;
            background: #05132d;
            font-size: 12px;
        }
        .phone {
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .location {
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <!-- عرض شعار المحل الملون -->
    <img src="logo.png" alt="عالم الألعاب" class="logo-img">

    <div class="badge">PS4 GoldHEN Host - FW 7.00 - 13.00</div>

    <div id="status-box" class="status-box">
        جاري التفعيل تلقائي...
    </div>

    <div class="services">
        <div class="service-btn">صالة ألعاب</div>
        <div class="service-btn">تحميل الألعاب</div>
        <div class="service-btn">صيانة PS4</div>
        <div class="service-btn">ملحقات سوني</div>
    </div>

    <div class="footer">
        <div class="phone">780621076</div>
        <div class="location">الموقع: الشحر - شارع مسجد وبير</div>
    </div>

    <script>
        function setStatus(type, text) {
            const box = document.getElementById('status-box');
            box.className = 'status-box ' + type;
            box.innerText = text;
        }
    </script>
</body>
</html>
