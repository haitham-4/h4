<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الألعاب - PS4 GoldHEN Host</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0B193C 0%, #030814 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.4;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .main-title {
            font-size: 3.2rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 15px #f39c12, 0 0 25px #e67e22;
            margin-bottom: 10px;
            text-align: center;
        }

        .badge {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #f1c40f;
            color: #f1c40f;
            padding: 6px 25px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(241, 196, 15, 0.6);
            margin-bottom: 35px;
        }

        .status-box-container {
            width: 100%;
            max-width: 650px;
            margin: 20px 0;
        }

        .status-box {
            background-color: #000;
            border: 3px solid #f1c40f;
            border-radius: 25px;
            padding: 35px 20px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 0 20px #f1c40f, inset 0 0 15px rgba(241, 196, 15, 0.3);
            transition: all 0.3s ease-in-out;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1.5;
            white-space: pre-line;
        }

        .status-box.success {
            border-color: #00ff66 !important;
            box-shadow: 0 0 25px #00ff66, inset 0 0 15px rgba(0, 255, 102, 0.4) !important;
            color: #00ff66;
        }

        .status-box.failed {
            border-color: #ff0044 !important;
            box-shadow: 0 0 25px #ff0044, inset 0 0 15px rgba(255, 0, 68, 0.4) !important;
            color: #ff4d4d;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            width: 100%;
            margin-top: 30px;
        }

        .service-card {
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #f1c40f;
            border-radius: 15px;
            padding: 12px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .footer {
            width: 100%;
            background: linear-gradient(180deg, rgba(15, 32, 67, 0.9) 0%, rgba(3, 8, 20, 0.95) 100%);
            border-top: 3px solid #f1c40f;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            z-index: 2;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -5px 15px rgba(241, 196, 15, 0.2);
        }

        .footer .phone {
            font-size: 1.6rem;
            color: #fff;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .footer .location {
            font-size: 1.1rem;
            color: #e0e0e0;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="main-title">عالم الألعاب</h1>
        <div class="badge">PS4 GoldHEN Host - FW 7.00 - 13.00</div>

        <div class="status-box-container">
            <div id="status-box" class="status-box">
                جاري التفعيل تلقائي...
            </div>
        </div>

        <div class="services-grid">
            <div class="service-card">صالة ألعاب</div>
            <div class="service-card">تحميل الألعاب</div>
            <div class="service-card">صيانة PS4</div>
            <div class="service-card">ملحقات سوني</div>
        </div>
    </div>

    <div class="footer">
        <div class="phone">780621076</div>
        <div class="location">الموقع: الشحر - شارع مسجد وبير</div>
    </div>

    <script>
        function setStatus(type, text) {
            const box = document.getElementById('status-box');
            box.className = 'status-box ' + type;
            box.innerText = text;
        }

        window.onload = function() {
            setStatus('', 'جاري التفعيل تلقائي...');
        };
    </script>
</body>
</html>
